<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VaultLink — Zaloguj się lub dołącz</title>
    <meta name="description" content="Bezpieczne logowanie i rejestracja do VaultLink. Twoje linki, Twoje szyfrowanie.">
    
    <!-- Google Fonts: Syne + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080a0f;
            --surface: #0d1017;
            --surface-elevated: #131720;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 255, 170, 0.25);
            --accent: #00ffaa;
            --accent-hover: #00e69a;
            --danger: #ff3b5c;
            --danger-glow: rgba(255, 59, 92, 0.25);
            --text-primary: #f0f3fa;
            --text-secondary: #8e95a8;
            --muted: #4a4f62;
            --font-display: 'Syne', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            background: var(--bg);
            font-family: var(--font-display);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 24px;
        }

        /* noise + grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 255, 170, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 170, 0.02) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* animated orb */
        .orb-bg {
            position: fixed;
            width: 70vw;
            height: 70vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(0, 255, 170, 0.08), transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(90px);
            z-index: 0;
            opacity: 0.6;
            animation: floatOrb 18s infinite alternate;
        }

        @keyframes floatOrb {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
            100% { transform: translate(-50%, -55%) scale(1.2); opacity: 0.7; }
        }

        /* card container */
        .auth-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            animation: fadeInUp 0.65s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(13, 16, 23, 0.8);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-subtle);
            border-radius: 32px;
            padding: 40px 32px 44px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(0, 255, 170, 0.1);
            transition: box-shadow 0.3s;
        }

        .card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 30px 55px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 170, 0.2);
        }

        /* logo area */
        .logo-area {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon-big {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--accent);
            background: rgba(0, 255, 170, 0.08);
            padding: 8px 22px;
            border-radius: 80px;
            border: 1px solid rgba(0, 255, 170, 0.3);
            backdrop-filter: blur(4px);
        }

        .logo-icon-big span:first-child {
            font-size: 28px;
        }

        .logo-icon-big span:last-child {
            letter-spacing: -0.5px;
        }

        .subhead {
            text-align: center;
            margin-top: 14px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-subtle);
            display: inline-block;
            width: auto;
            padding-top: 12px;
        }

        /* toggle buttons */
        .toggle-row {
            display: flex;
            gap: 12px;
            background: var(--surface);
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 32px;
            border: 1px solid var(--border-subtle);
        }

        .toggle-btn {
            flex: 1;
            text-align: center;
            background: transparent;
            border: none;
            padding: 10px 12px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #080a0f;
            box-shadow: 0 2px 8px rgba(0, 255, 170, 0.3);
        }

        /* form group */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-mono);
            margin-bottom: 8px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px 18px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 255, 170, 0.15);
        }

        .input-wrapper input::placeholder {
            color: var(--muted);
        }

        /* action button */
        .action-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            border-radius: 60px;
            padding: 14px 20px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 16px;
            color: #080a0f;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .action-btn:hover {
            background: var(--accent-hover);
            transform: scale(0.98);
            box-shadow: 0 4px 14px rgba(0, 255, 170, 0.4);
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(255, 59, 92, 0.12);
            border-left: 3px solid var(--danger);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: #ff8a9e;
            margin-bottom: 20px;
            display: none;
            backdrop-filter: blur(4px);
        }

        .info-message {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            font-family: var(--font-mono);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            border-bottom: 1px dashed var(--muted);
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        hr {
            border: none;
            height: 1px;
            background: var(--border-subtle);
            margin: 24px 0 16px;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--muted);
            margin-top: 24px;
        }

        /* mobile responsive */
        @media (max-width: 540px) {
            .card {
                padding: 30px 20px 36px;
            }
            .toggle-btn {
                font-size: 14px;
                padding: 8px 10px;
            }
            .action-btn {
                padding: 12px 16px;
            }
            body {
                padding: 16px;
            }
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(8, 10, 15, 0.3);
            border-top: 2px solid #080a0f;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="orb-bg"></div>
<div class="auth-container">
    <div class="card">
        <div class="logo-area">
            <div class="logo-icon-big">
                <span>🔐</span>
                <span>VaultLink</span>
            </div>
            <div class="subhead">Twoje linki · Zero dostępu</div>
        </div>

        <!-- toggle login / register -->
        <div class="toggle-row">
            <button class="toggle-btn active" id="btnLoginMode">Zaloguj się</button>
            <button class="toggle-btn" id="btnRegisterMode">Zarejestruj się</button>
        </div>

        <!-- global error banner -->
        <div id="globalError" class="error-message"></div>

        <!-- LOGIN FORM (visible domyślnie) -->
        <form id="loginForm" style="display: block;">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="loginEmail" placeholder="twoj@email.com" autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label>Hasło</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>
            <button type="submit" id="loginBtn" class="action-btn">
                <span>→ Zaloguj się</span>
            </button>
        </form>

        <!-- REGISTER FORM (hidden początkowo) -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <input type="email" id="regEmail" placeholder="twoj@email.com" autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label>Hasło</label>
                <div class="input-wrapper">
                    <input type="password" id="regPassword" placeholder="minimum 6 znaków" autocomplete="new-password">
                </div>
            </div>
            <div class="form-group">
                <label>Potwierdź hasło</label>
                <div class="input-wrapper">
                    <input type="password" id="regConfirmPassword" placeholder="powtórz hasło" autocomplete="off">
                </div>
            </div>
            <button type="submit" id="registerBtn" class="action-btn">
                <span>✚ Zarejestruj się</span>
            </button>
        </form>

        <hr>
        <div class="info-message">
            <a href="index.html" class="back-link">← Powrót do strony głównej</a>
        </div>
        <div class="footer-note">
            Szyfrowanie end-to-end · Twoja prywatność
        </div>
    </div>
</div>

<script>
    // ---------- KONFIGURACJA SUPABASE ----------
    const SUPABASE_URL = 'https://holxmnhiwtntcjcorave.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_M65K6nEKeX6-o9i8cadlDg_pkDxW39t';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ---------- ELEMENTY DOM ----------
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const btnLoginMode = document.getElementById('btnLoginMode');
    const btnRegisterMode = document.getElementById('btnRegisterMode');
    const globalErrorDiv = document.getElementById('globalError');

    // pola logowania
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');

    // pola rejestracji
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regConfirmPassword = document.getElementById('regConfirmPassword');
    const registerBtn = document.getElementById('registerBtn');

    // pomocnicze funkcje UI
    function showError(message) {
        globalErrorDiv.innerText = message;
        globalErrorDiv.style.display = 'block';
        setTimeout(() => {
            globalErrorDiv.style.display = 'none';
        }, 5000);
    }

    function clearErrors() {
        globalErrorDiv.style.display = 'none';
        globalErrorDiv.innerText = '';
    }

    function setLoading(button, isLoading, originalText) {
        if (isLoading) {
            button.disabled = true;
            button.innerHTML = `<span class="spinner"></span> <span>${originalText || 'Ładowanie...'}</span>`;
        } else {
            button.disabled = false;
            button.innerHTML = originalText;
        }
    }

    // ---------- PRZEŁĄCZANIE TRYBÓW (bez przeładowania) ----------
    function switchToLogin() {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        btnLoginMode.classList.add('active');
        btnRegisterMode.classList.remove('active');
        clearErrors();
        // opcjonalnie wyczyść błędy pól
    }

    function switchToRegister() {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        btnRegisterMode.classList.add('active');
        btnLoginMode.classList.remove('active');
        clearErrors();
    }

    btnLoginMode.addEventListener('click', switchToLogin);
    btnRegisterMode.addEventListener('click', switchToRegister);

    // ---------- SPRAWDŹ CZY UŻYTKOWNIK JEST JUŻ ZALOGOWANY ----------
    async function checkAlreadyLoggedIn() {
        try {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (session) {
                // już zalogowany → przekieruj na app.html
                window.location.href = 'app.html';
            }
        } catch (err) {
            console.warn("session check error", err);
        }
    }
    checkAlreadyLoggedIn();

    // dodatkowo nasłuch na zmiany sesji (jeśli loguje się w innej karcie)
    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_IN' && session) {
            window.location.href = 'app.html';
        }
    });

    // ---------- FUNKCJA LOGOWANIA (Supabase Auth) ----------
    async function handleLogin(e) {
        e.preventDefault();
        clearErrors();

        const email = loginEmail.value.trim();
        const password = loginPassword.value;

        if (!email) {
            showError('Podaj adres email.');
            return;
        }
        if (!password) {
            showError('Wprowadź hasło.');
            return;
        }

        const originalBtnText = '<span>→ Zaloguj się</span>';
        setLoading(loginBtn, true, 'Logowanie...');
        
        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });
            
            if (error) {
                let polishMsg = '';
                if (error.message.includes('Invalid login credentials')) {
                    polishMsg = 'Nieprawidłowy email lub hasło. Spróbuj ponownie.';
                } else if (error.message.includes('Email not confirmed')) {
                    polishMsg = 'Email nie został potwierdzony. Sprawdź skrzynkę odbiorczą.';
                } else {
                    polishMsg = `Błąd logowania: ${error.message}`;
                }
                throw new Error(polishMsg);
            }
            
            // sukces - sesja jest aktywna, przekierowanie nastąpi przez onAuthStateChange,
            // ale dla bezpieczeństwa od razu redirect
            if (data.session) {
                window.location.href = 'app.html';
            } else {
                window.location.href = 'app.html';
            }
        } catch (err) {
            showError(err.message || 'Wystąpił nieoczekiwany błąd. Spróbuj później.');
            setLoading(loginBtn, false, originalBtnText);
        }
    }

    // ---------- REJESTRACJA (walidacja + Supabase) ----------
    async function handleRegister(e) {
        e.preventDefault();
        clearErrors();

        const email = regEmail.value.trim();
        const password = regPassword.value;
        const confirm = regConfirmPassword.value;

        if (!email) {
            showError('Podaj adres email.');
            return;
        }
        if (!password) {
            showError('Hasło jest wymagane.');
            return;
        }
        if (password.length < 6) {
            showError('Hasło musi mieć co najmniej 6 znaków.');
            return;
        }
        if (password !== confirm) {
            showError('Hasła nie są identyczne. Sprawdź poprawność.');
            return;
        }

        const originalBtnText = '<span>✚ Zarejestruj się</span>';
        setLoading(registerBtn, true, 'Rejestracja...');
        
        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: window.location.origin + '/app.html',
                }
            });
            
            if (error) {
                let polishMsg = '';
                if (error.message.includes('User already registered')) {
                    polishMsg = 'Konto z tym adresem email już istnieje. Zaloguj się zamiast tego.';
                } else if (error.message.includes('Password should be at least')) {
                    polishMsg = 'Hasło jest zbyt słabe — minimum 6 znaków.';
                } else {
                    polishMsg = `Błąd rejestracji: ${error.message}`;
                }
                throw new Error(polishMsg);
            }
            
            // jeśli użytkownik został utworzony, Supabase może wymagać potwierdzenia email.
            if (data.user && data.user.identities && data.user.identities.length === 0) {
                showError('Ten email jest już zajęty. Zaloguj się lub zresetuj hasło.');
                setLoading(registerBtn, false, originalBtnText);
                return;
            }
            
            // sukces rejestracji
            let successMessage = 'Rejestracja udana! Sprawdź swoją skrzynkę email, aby potwierdzić konto. Następnie możesz się zalogować.';
            showError(successMessage); // użyjemy tego jako zielony? zmieniamy styl krótko na sukces ale error div użyjemy tymczasowo w pozytywny sposób
            const oldBg = globalErrorDiv.style.background;
            globalErrorDiv.style.background = 'rgba(0, 255, 170, 0.12)';
            globalErrorDiv.style.borderLeftColor = '#00ffaa';
            globalErrorDiv.style.color = '#b0ffdd';
            globalErrorDiv.innerText = successMessage;
            globalErrorDiv.style.display = 'block';
            setTimeout(() => {
                globalErrorDiv.style.background = oldBg;
                globalErrorDiv.style.borderLeftColor = 'var(--danger)';
                globalErrorDiv.style.color = '#ff8a9e';
                globalErrorDiv.style.display = 'none';
            }, 6000);
            
            // wyczyść pola rejestracji
            regEmail.value = '';
            regPassword.value = '';
            regConfirmPassword.value = '';
            // automatycznie przełącz na tryb logowania, aby użytkownik mógł się zalogować
            setTimeout(() => {
                switchToLogin();
                // opcjonalnie wypełnij login emailem
                loginEmail.value = email;
            }, 500);
            
        } catch (err) {
            showError(err.message || 'Nie udało się utworzyć konta. Spróbuj ponownie.');
        } finally {
            setLoading(registerBtn, false, originalBtnText);
        }
    }

    // ---------- PODPIĘCIE EVENTÓW ----------
    loginForm.addEventListener('submit', handleLogin);
    registerForm.addEventListener('submit', handleRegister);
    
    // dodatkowa obsługa enter na polach (przez form submit już działa)
    // aby uniknąć niechcianych zachowań, zabezpieczamy

    // funkcja pomocniczo pokazująca polskie komunikaty w jednym miejscu: blokada powtórnych wysłań
    // już wszystkie błędy są obsłużone w języku polskim
</script>
</body>
</html>
