<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VaultLink — Twoja zaszyfrowana baza linków</title>
    <meta name="description" content="Zarządzaj swoimi linkami, notatkami i tagami w bezpiecznej, zaszyfrowanej przestrzeni.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080a0f;
            --surface: #0d1017;
            --surface-hover: #131720;
            --border: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 255, 170, 0.25);
            --accent: #00ffaa;
            --accent-dark: #00cc88;
            --danger: #ff3b5c;
            --danger-hover: #e62e4f;
            --text-primary: #f0f3fa;
            --text-secondary: #8e95a8;
            --muted: #4a4f62;
            --font-display: 'Syne', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.2s ease;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-display);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px 48px;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: rgba(13, 16, 23, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 12px 28px;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 20px;
            color: var(--accent);
        }

        .logo span:first-child {
            font-size: 26px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 13px;
            background: var(--surface);
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        .user-email {
            color: var(--text-secondary);
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 30px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .logout-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(255, 59, 92, 0.08);
        }

        /* controls row */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 48px;
            padding: 12px 20px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 255, 170, 0.2);
        }

        .add-btn {
            background: var(--accent);
            border: none;
            padding: 12px 28px;
            border-radius: 48px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            color: #080a0f;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-btn:hover {
            background: var(--accent-dark);
            transform: scale(0.97);
        }

        /* tag filters */
        .tag-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .filter-chip {
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 40px;
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .filter-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #080a0f;
            font-weight: 600;
        }

        .filter-chip:hover:not(.active) {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* links grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 12px;
        }

        .link-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            transition: var(--transition);
            position: relative;
        }

        .link-card:hover {
            border-color: var(--border-glow);
            background: var(--surface-hover);
            transform: translateY(-3px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            word-break: break-word;
            padding-right: 12px;
        }

        .delete-link {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px 8px;
            border-radius: 12px;
        }

        .delete-link:hover {
            color: var(--danger);
            background: rgba(255, 59, 92, 0.1);
        }

        .card-url {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 12px;
            word-break: break-all;
            text-decoration: none;
            display: inline-block;
        }

        .card-url:hover {
            text-decoration: underline;
        }

        .card-tag {
            display: inline-block;
            background: rgba(0, 255, 170, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            margin-bottom: 12px;
            border: 0.5px solid rgba(0, 255, 170, 0.3);
        }

        .card-note {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 70px 20px;
            background: var(--surface);
            border-radius: 32px;
            border: 1px dashed var(--border);
            color: var(--muted);
            font-family: var(--font-mono);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--surface);
            border: 1px solid var(--border-glow);
            border-radius: 32px;
            max-width: 520px;
            width: 100%;
            padding: 32px;
            animation: fadeIn 0.25s ease;
        }

        .modal-content h3 {
            font-size: 26px;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .modal-content input, .modal-content textarea, .modal-content select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 18px;
            outline: none;
        }

        .modal-content input:focus, .modal-content textarea:focus, .modal-content select:focus {
            border-color: var(--accent);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .modal-buttons button {
            padding: 10px 20px;
            border-radius: 40px;
            font-family: var(--font-display);
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-save {
            background: var(--accent);
            color: #080a0f;
        }

        @media (max-width: 680px) {
            .app-container {
                padding: 16px;
            }
            .navbar {
                flex-direction: column;
                align-items: stretch;
                border-radius: 28px;
            }
            .user-info {
                justify-content: space-between;
            }
            .links-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="navbar">
        <div class="logo">
            <span>🔐</span>
            <span>VaultLink</span>
        </div>
        <div class="user-info">
            <span class="user-email" id="userEmail">ładowanie...</span>
            <span class="user-email" id="userEmail2">ładowanie...</span>
            <button class="logout-btn" id="logoutBtn">Wyloguj</button>
        </div>
    </div>

    <div class="controls-row">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Szukaj w tytułach lub URL...">
        </div>
        <button class="add-btn" id="openModalBtn">+ Dodaj link</button>
    </div>

    <div class="tag-filters" id="tagFiltersContainer">
        <button data-tag="all" class="filter-chip active">Wszystkie</button>
        <button data-tag="praca" class="filter-chip">praca</button>
        <button data-tag="dev" class="filter-chip">dev</button>
        <button data-tag="finanse" class="filter-chip">finanse</button>
        <button data-tag="prywatne" class="filter-chip">prywatne</button>
        <button data-tag="inne" class="filter-chip">inne</button>
    </div>

    <div id="linksContainer" class="links-grid">
        <div class="empty-state">Ładowanie linków...</div>
    </div>
</div>

<div id="linkModal" class="modal">
    <div class="modal-content">
        <h3>Nowy link</h3>
        <input type="text" id="modalUrl" placeholder="URL (np. https://...)" autocomplete="off">
        <input type="text" id="modalTitle" placeholder="Tytuł *" autocomplete="off">
        <textarea id="modalNote" rows="3" placeholder="Notatka (opcjonalnie)"></textarea>
        <select id="modalTag">
            <option value="praca">praca</option>
            <option value="dev">dev</option>
            <option value="finanse">finanse</option>
            <option value="prywatne">prywatne</option>
            <option value="inne">inne</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-cancel" id="closeModalBtn">Anuluj</button>
            <button class="btn-save" id="saveLinkBtn">Zapisz</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://holxmnhiwtntcjcorave.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_M65K6nEKeX6-o9i8cadlDg_pkDxW39t';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let allLinks = [];
    let currentTagFilter = 'all';
    let searchQuery = '';

    const userEmailSpan = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');
    const linksContainer = document.getElementById('linksContainer');
    const searchInput = document.getElementById('searchInput');
    const openModalBtn = document.getElementById('openModalBtn');
    const modal = document.getElementById('linkModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveLinkBtn = document.getElementById('saveLinkBtn');
    const modalUrl = document.getElementById('modalUrl');
    const modalTitle = document.getElementById('modalTitle');
    const modalNote = document.getElementById('modalNote');
    const modalTag = document.getElementById('modalTag');

    async function checkSessionAndRedirect() {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = '/login.html';
            return null;
        }
        currentUser = session.user;
        userEmailSpan.innerText = currentUser.email || currentUser.user_metadata?.email || 'użytkownik';
        const userEmailSpan2 = document.getElementById('userEmail2');
        if (userEmailSpan2) userEmailSpan2.innerText = userEmailSpan.innerText;
        return session;
    }

    async function fetchLinks() {
        if (!currentUser) return;
        const { data, error } = await supabaseClient
            .from('links')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });
        if (error) {
            console.error(error);
            allLinks = [];
        } else {
            allLinks = data || [];
        }
        renderLinks();
    }

    function renderLinks() {
        let filtered = [...allLinks];
        if (searchQuery.trim() !== '') {
            const q = searchQuery.trim().toLowerCase();
            filtered = filtered.filter(link => 
                (link.title && link.title.toLowerCase().includes(q)) || 
                (link.url && link.url.toLowerCase().includes(q))
            );
        }
        if (currentTagFilter !== 'all') {
            filtered = filtered.filter(link => link.tag === currentTagFilter);
        }

        if (filtered.length === 0) {
            linksContainer.innerHTML = `<div class="empty-state">📭 ${allLinks.length === 0 ? 'Dodaj swój pierwszy link' : 'Brak wyników wyszukiwania'}</div>`;
            return;
        }

        linksContainer.innerHTML = filtered.map(link => `
            <div class="link-card" data-link-id="${link.id}">
                <div class="card-header">
                    <div class="card-title">${escapeHtml(link.title || 'Bez tytułu')}</div>
                    <button class="delete-link" data-id="${link.id}" title="Usuń link">🗑️</button>
                </div>
                <a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="card-url">${truncateUrl(link.url)}</a>
                <div class="card-tag">#${escapeHtml(link.tag || 'inne')}</div>
                ${link.note ? `<div class="card-note">📝 ${escapeHtml(link.note)}</div>` : ''}
            </div>
        `).join('');

        document.querySelectorAll('.delete-link').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const linkId = btn.getAttribute('data-id');
                if (confirm('Czy na pewno usunąć ten link?')) {
                    await deleteLink(linkId);
                }
            });
        });
    }

    function truncateUrl(url) {
        if (!url) return '';
        if (url.length > 50) return url.slice(0, 47) + '...';
        return url;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    async function deleteLink(linkId) {
        if (!currentUser) return;
        const { error } = await supabaseClient.from('links').delete().eq('id', linkId).eq('user_id', currentUser.id);
        if (error) {
            alert('Błąd usuwania: ' + error.message);
        } else {
            allLinks = allLinks.filter(l => l.id !== linkId);
            renderLinks();
        }
    }

    async function addLink(url, title, note, tag) {
        if (!currentUser) return false;
        if (!url || !title) {
            alert('URL i Tytuł są wymagane');
            return false;
        }
        const { data, error } = await supabaseClient.from('links').insert([{
            user_id: currentUser.id,
            url: url.trim(),
            title: title.trim(),
            note: note ? note.trim() : null,
            tag: tag,
            created_at: new Date().toISOString()
        }]).select();
        if (error) {
            alert('Błąd zapisu: ' + error.message);
            return false;
        }
        if (data && data.length) allLinks = [data[0], ...allLinks];
        renderLinks();
        return true;
    }

    function openModal() {
        modalUrl.value = '';
        modalTitle.value = '';
        modalNote.value = '';
        modalTag.value = 'praca';
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    async function handleSaveLink() {
        const url = modalUrl.value.trim();
        const title = modalTitle.value.trim();
        const note = modalNote.value.trim();
        const tag = modalTag.value;
        if (!url || !title) {
            alert('Proszę wypełnić URL oraz Tytuł.');
            return;
        }
        const success = await addLink(url, title, note, tag);
        if (success) {
            closeModal();
        }
    }

    function updateFilterUI() {
        document.querySelectorAll('.filter-chip').forEach(chip => {
            const tagValue = chip.getAttribute('data-tag');
            if ((tagValue === 'all' && currentTagFilter === 'all') || (tagValue === currentTagFilter)) {
                chip.classList.add('active');
            } else {
                chip.classList.remove('active');
            }
        });
    }

    function setupEventListeners() {
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/login.html';
        });

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        saveLinkBtn.addEventListener('click', handleSaveLink);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLinks();
        });

        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                const tag = chip.getAttribute('data-tag');
                if (tag === 'all') currentTagFilter = 'all';
                else currentTagFilter = tag;
                updateFilterUI();
                renderLinks();
            });
        });
    }

    async function init() {
        const session = await checkSessionAndRedirect();
        if (!session) return;
        setupEventListeners();
        await fetchLinks();
        supabaseClient.auth.onAuthStateChange(async (event, sess) => {
            if (event === 'SIGNED_OUT') {
                window.location.href = '/login.html';
            } else if (event === 'SIGNED_IN' && sess) {
                currentUser = sess.user;
                userEmailSpan.innerText = currentUser.email;
                await fetchLinks();
            }
        });
    }

    init();
</script>
</body>
</html>
