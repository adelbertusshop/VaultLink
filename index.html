<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VaultLink — Logowanie</title>
    <meta name="description" content="Zaloguj się do swojej zaszyfrowanej bazy linków.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080a0f;
            --surface: #0d1017;
            --surface-hover: #131720;
            --border: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 255, 170, 0.25);
            --accent: #00ffaa;
            --accent-dark: #00cc88;
            --danger: #ff3b5c;
            --text-primary: #f0f3fa;
            --text-secondary: #8e95a8;
            --muted: #4a4f62;
            --font-display: 'Syne', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.2s ease;
        }

        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: var(--font-display);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            margin: 20px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(13, 16, 23, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 48px;
            padding: 48px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 32px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo span:first-child {
            font-size: 42px;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 18px;
            padding: 8px 20px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 40px;
        }

        .tab-btn.active {
            color: var(--accent);
            background: rgba(0, 255, 170, 0.1);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 14px 18px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(0, 255, 170, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 16px;
            color: #080a0f;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 12px;
        }

        .submit-btn:hover {
            background: var(--accent-dark);
            transform: scale(0.98);
        }

        .message {
            margin-top: 20px;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .message.error {
            color: var(--danger);
        }

        .message.success {
            color: var(--accent);
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 32px 24px;
            }
            .logo {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <span>🔐</span>
            <span>VaultLink</span>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="login">Logowanie</button>
            <button class="tab-btn" data-tab="register">Rejestracja</button>
        </div>

        <div id="loginForm" class="form-panel">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="twoj@email.com">
            </div>
            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button class="submit-btn" id="loginBtn">Zaloguj się</button>
        </div>

        <div id="registerForm" class="form-panel" style="display: none;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="twoj@email.com">
            </div>
            <div class="form-group">
                <label>Hasło (minimum 6 znaków)</label>
                <input type="password" id="registerPassword" placeholder="••••••••">
            </div>
            <button class="submit-btn" id="registerBtn">Załóż konto</button>
        </div>

        <div id="message" class="message"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://holxmnhiwtntcjcorave.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_M65K6nEKeX6-o9i8cadlDg_pkDxW39t';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentTab = 'login';

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const registerEmail = document.getElementById('registerEmail');
    const registerPassword = document.getElementById('registerPassword');
    const messageDiv = document.getElementById('message');
    const tabBtns = document.querySelectorAll('.tab-btn');

    function showMessage(text, isError = false) {
        messageDiv.textContent = text;
        messageDiv.className = 'message';
        if (isError) messageDiv.classList.add('error');
        else messageDiv.classList.add('success');
        setTimeout(() => {
            messageDiv.textContent = '';
            messageDiv.className = 'message';
        }, 5000);
    }

    async function handleLogin() {
        const email = loginEmail.value.trim();
        const password = loginPassword.value.trim();

        if (!email || !password) {
            showMessage('Wypełnij wszystkie pola', true);
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            showMessage('Błąd logowania: ' + error.message, true);
        } else {
            showMessage('Zalogowano pomyślnie! Przekierowanie...');
            setTimeout(() => {
                window.location.href = '/app.html';
            }, 1000);
        }
    }

    async function handleRegister() {
        const email = registerEmail.value.trim();
        const password = registerPassword.value.trim();

        if (!email || !password) {
            showMessage('Wypełnij wszystkie pola', true);
            return;
        }

        if (password.length < 6) {
            showMessage('Hasło musi mieć co najmniej 6 znaków', true);
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

        if (error) {
            showMessage('Błąd rejestracji: ' + error.message, true);
        } else {
            if (data.user?.identities?.length === 0) {
                showMessage('Użytkownik już istnieje', true);
            } else {
                showMessage('Rejestracja udana! Możesz się zalogować.');
                setTimeout(() => {
                    document.querySelector('[data-tab="login"]').click();
                }, 1500);
            }
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        if (tab === 'login') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        }
        
        tabBtns.forEach(btn => {
            const btnTab = btn.getAttribute('data-tab');
            if (btnTab === tab) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    async function checkSessionAndRedirect() {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (session) {
            window.location.href = '/app.html';
        }
    }

    function setupEventListeners() {
        loginBtn.addEventListener('click', handleLogin);
        registerBtn.addEventListener('click', handleRegister);
        
        loginEmail.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
        registerEmail.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRegister();
        });
        registerPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRegister();
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                switchTab(tab);
            });
        });
    }

    async function init() {
        await checkSessionAndRedirect();
        setupEventListeners();
    }

    init();
</script>
</body>
</html>
