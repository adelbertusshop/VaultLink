<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VaultLink — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#080a0f;--surface:#0d1017;--surface2:#131720;--border:rgba(255,255,255,0.06);--border-glow:rgba(0,255,170,0.2);--accent:#00ffaa;--accent2:#00aaff;--danger:#ff3b5c;--text:#e8eaf0;--muted:#5a6070;--font:'Syne',sans-serif;--mono:'JetBrains Mono',monospace;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
    body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,170,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,170,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
    nav{position:sticky;top:0;z-index:100;background:rgba(8,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
    .logo{font-family:var(--mono);font-size:16px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .nav-right{display:flex;align-items:center;gap:12px;}
    .user-email{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .plan-badge{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:10px;}
    .plan-badge.free{color:var(--muted);border:1px solid var(--border);background:transparent;}
    .plan-badge.pro{color:#000;background:var(--accent);border:1px solid var(--accent);}
    .btn-logout{font-family:var(--mono);font-size:12px;color:var(--danger);background:rgba(255,59,92,0.08);border:1px solid rgba(255,59,92,0.2);padding:6px 14px;border-radius:6px;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
    .btn-logout:hover{background:rgba(255,59,92,0.15);}
    main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 24px 80px;}
    .toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
    .search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;transition:border-color 0.2s;}
    .search-box:focus-within{border-color:var(--border-glow);}
    .search-box input{flex:1;background:transparent;border:none;outline:none;font-family:var(--mono);font-size:13px;color:var(--text);}
    .search-box input::placeholder{color:var(--muted);}
    .btn-add{background:var(--accent);color:#000;border:none;padding:10px 20px;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
    .btn-add:hover{background:#00ffcc;}
    .btn-add:disabled{opacity:0.5;cursor:not-allowed;}
    .limit-bar{margin-bottom:20px;display:none;}
    .limit-bar.visible{display:block;}
    .limit-info{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
    .limit-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
    .limit-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s;}
    .limit-fill.danger{background:var(--danger);}
    .filters{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
    .chip{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all 0.2s;}
    .chip:hover{border-color:var(--border-glow);color:var(--accent);}
    .chip.active{border-color:var(--accent);color:var(--accent);background:rgba(0,255,170,0.08);}
    .links-grid{display:grid;gap:10px;}
    .link-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:flex-start;gap:14px;transition:border-color 0.2s,background 0.2s;animation:fadeIn 0.3s ease both;}
    .link-card:hover{border-color:var(--border-glow);background:var(--surface2);}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .link-favicon{width:36px;height:36px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .link-body{flex:1;min-width:0;}
    .link-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .link-url{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;}
    .link-url a{color:var(--muted);text-decoration:none;}
    .link-url a:hover{color:var(--accent2);}
    .link-note{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
    .link-meta{display:flex;align-items:center;gap:8px;}
    .tag-badge{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;}
    .tag-praca{color:var(--accent);border:1px solid rgba(0,255,170,0.3);background:rgba(0,255,170,0.06);}
    .tag-dev{color:var(--accent2);border:1px solid rgba(0,170,255,0.3);background:rgba(0,170,255,0.06);}
    .tag-finanse{color:#ffd166;border:1px solid rgba(255,209,102,0.3);background:rgba(255,209,102,0.06);}
    .tag-prywatne{color:#c77dff;border:1px solid rgba(199,125,255,0.3);background:rgba(199,125,255,0.06);}
    .tag-inne{color:var(--muted);border:1px solid var(--border);background:transparent;}
    .link-actions{display:flex;gap:6px;flex-shrink:0;}
    .btn-icon{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s;}
    .btn-icon:hover{border-color:rgba(255,59,92,0.4);color:var(--danger);background:rgba(255,59,92,0.08);}
    .btn-icon.edit:hover{border-color:var(--border-glow);color:var(--accent);background:rgba(0,255,170,0.06);}
    .empty-state{text-align:center;padding:80px 24px;display:none;}
    .empty-state .icon{font-size:48px;margin-bottom:16px;}
    .empty-state h3{font-size:20px;font-weight:700;margin-bottom:8px;}
    .empty-state p{font-family:var(--mono);font-size:13px;color:var(--muted);}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:200;align-items:center;justify-content:center;padding:24px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--surface);border:1px solid var(--border-glow);border-radius:16px;padding:32px;width:100%;max-width:480px;animation:modalIn 0.25s ease both;}
    @keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
    .modal-title{font-size:18px;font-weight:800;}
    .btn-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
    .btn-close:hover{border-color:var(--danger);color:var(--danger);}
    .form-group{margin-bottom:16px;}
    .form-label{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:block;}
    .form-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:13px;color:var(--text);outline:none;transition:border-color 0.2s;}
    .form-input:focus{border-color:var(--border-glow);}
    .form-input::placeholder{color:var(--muted);}
    .btn-save{width:100%;background:var(--accent);color:#000;border:none;padding:12px;border-radius:10px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:all 0.2s;}
    .btn-save:hover{background:#00ffcc;}
    .btn-save:disabled{opacity:0.5;cursor:not-allowed;}
    .upgrade-modal{background:var(--surface);border:1px solid rgba(0,255,170,0.3);border-radius:16px;padding:40px 32px;width:100%;max-width:420px;text-align:center;animation:modalIn 0.25s ease both;}
    .upgrade-icon{font-size:48px;margin-bottom:16px;}
    .upgrade-title{font-size:24px;font-weight:800;margin-bottom:12px;letter-spacing:-1px;}
    .upgrade-desc{font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:28px;}
    .btn-upgrade{width:100%;background:var(--accent);color:#000;border:none;padding:14px;border-radius:10px;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-bottom:12px;}
    .btn-upgrade:hover{background:#00ffcc;}
    .btn-upgrade-skip{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);padding:12px;border-radius:10px;font-family:var(--mono);font-size:13px;cursor:pointer;transition:all 0.2s;}
    .btn-upgrade-skip:hover{border-color:var(--border-glow);color:var(--text);}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border-glow);color:var(--accent);font-family:var(--mono);font-size:13px;padding:12px 24px;border-radius:10px;z-index:999;transition:transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);white-space:nowrap;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500;font-family:var(--mono);font-size:14px;color:var(--accent);gap:12px;}
    .spinner{width:20px;height:20px;border:2px solid rgba(0,255,170,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @media(max-width:600px){.user-email{display:none;}.toolbar{flex-direction:column;}.btn-add{width:100%;}}
  </style>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#00ffaa"/>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
  <div id="pwaBanner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(0,255,170,0.12);border-bottom:1px solid rgba(0,255,170,0.3);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#00ffaa;">
  <span>📱 Zainstaluj VaultLink — menu przeglądarki → "Dodaj do ekranu głównego"</span>
  <button onclick="document.getElementById('pwaBanner').style.display='none';localStorage.setItem('pwaDismissed','1')" style="background:transparent;border:1px solid rgba(0,255,170,0.3);color:#00ffaa;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:11px;">✕</button>
</div>
<script>
  if(/Android|iPhone|iPad/i.test(navigator.userAgent) && !window.matchMedia('(display-mode: standalone)').matches && !localStorage.getItem('pwaDismissed')) {
    document.getElementById('pwaBanner').style.display='flex';
  }
</script>
<div class="loading-screen" id="loadingScreen"><div class="spinner"></div>Ładowanie...</div>
<nav>
  <div class="logo">🔐 VaultLink</div>
  <div class="nav-right">
    <span class="user-email" id="userEmail"></span>
    <span class="plan-badge free" id="planBadge">FREE</span>
    <button class="btn-logout" id="btnLogout">Wyloguj</button>
  </div>
</nav>
<main>
  <div class="toolbar">
    <div class="search-box"><span>🔍</span><input type="text" id="searchInput" placeholder="Szukaj linków..."/></div>
    <button class="btn-add" id="btnAdd">+ Dodaj link</button>
  </div>
  <div class="limit-bar" id="limitBar">
    <div class="limit-info"><span>Plan Free</span><span id="limitCount">0 / 10</span></div>
    <div class="limit-track"><div class="limit-fill" id="limitFill" style="width:0%"></div></div>
  </div>
  <div class="filters">
    <button class="chip active" data-tag="all">Wszystkie</button>
    <button class="chip" data-tag="praca">praca</button>
    <button class="chip" data-tag="dev">dev</button>
    <button class="chip" data-tag="finanse">finanse</button>
    <button class="chip" data-tag="prywatne">prywatne</button>
    <button class="chip" data-tag="inne">inne</button>
  </div>
  <div class="links-grid" id="linksGrid"></div>
  <div class="empty-state" id="emptyState"><div class="icon">🔐</div><h3>Brak linków</h3><p>Kliknij "+ Dodaj link" żeby zacząć.</p></div>
</main>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitleText">Nowy link</div><button class="btn-close" id="btnClose">✕</button></div>
    <div class="form-group"><label class="form-label">URL *</label><input class="form-input" type="url" id="inputUrl" placeholder="https://..."/></div>
    <div class="form-group"><label class="form-label">Tytuł *</label><input class="form-input" type="text" id="inputTitle" placeholder="Nazwa strony"/></div>
    <div class="form-group"><label class="form-label">Notatka</label><input class="form-input" type="text" id="inputNote" placeholder="Opcjonalny opis..."/></div>
    <div class="form-group"><label class="form-label">Tag</label><select class="form-input" id="inputTag"><option value="inne">inne</option><option value="praca">praca</option><option value="dev">dev</option><option value="finanse">finanse</option><option value="prywatne">prywatne</option></select></div>
    <button class="btn-save" id="btnSave">Zapisz link</button>
  </div>
</div>
<div class="modal-overlay" id="upgradeOverlay">
  <div class="upgrade-modal">
    <div class="upgrade-icon">🔐</div>
    <div class="upgrade-title">Limit osiągnięty</div>
    <div class="upgrade-desc">Wykorzystałeś wszystkie 10 linków w planie Free.<br/>Przejdź na Pro i dodawaj bez limitów.</div>
    <button class="btn-upgrade" onclick="window.location.href='/pricing.html'">Przejdź na Pro — 4.99$/mies →</button>
    <button class="btn-upgrade-skip" id="btnSkipUpgrade">Może później</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const SUPABASE_URL='https://holxmnhiwtntcjcorave.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_M65K6nEKeX6-o9i8cadlDg_pkDxW39t';
  const FREE_LIMIT=10;
  const _supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  let currentUser=null,allLinks=[],currentTag='all',searchQuery='',userPlan='free',editingId=null;
  const loadingScreen=document.getElementById('loadingScreen');
  const userEmailEl=document.getElementById('userEmail');
  const planBadge=document.getElementById('planBadge');
  const btnLogout=document.getElementById('btnLogout');
  const searchInput=document.getElementById('searchInput');
  const btnAdd=document.getElementById('btnAdd');
  const linksGrid=document.getElementById('linksGrid');
  const emptyState=document.getElementById('emptyState');
  const modalOverlay=document.getElementById('modalOverlay');
  const upgradeOverlay=document.getElementById('upgradeOverlay');
  const btnClose=document.getElementById('btnClose');
  const btnSave=document.getElementById('btnSave');
  const btnSkipUpgrade=document.getElementById('btnSkipUpgrade');
  const inputUrl=document.getElementById('inputUrl');
  const inputTitle=document.getElementById('inputTitle');
  const inputNote=document.getElementById('inputNote');
  const inputTag=document.getElementById('inputTag');
  const modalTitleText=document.getElementById('modalTitleText');
  const toastEl=document.getElementById('toast');
  const limitBar=document.getElementById('limitBar');
  const limitCount=document.getElementById('limitCount');
  const limitFill=document.getElementById('limitFill');
  const chips=document.querySelectorAll('.chip');
  function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),3000);}
  function updateLimitBar(){
    if(userPlan==='pro'){limitBar.classList.remove('visible');planBadge.textContent='PRO';planBadge.className='plan-badge pro';btnAdd.disabled=false;return;}
    const count=allLinks.length,pct=Math.min((count/FREE_LIMIT)*100,100);
    limitBar.classList.add('visible');
    limitCount.textContent=`${count} / ${FREE_LIMIT}`;
    limitFill.style.width=pct+'%';
    limitFill.className='limit-fill'+(pct>=80?' danger':'');
    btnAdd.disabled=count>=FREE_LIMIT;
  }
  function openModal(link=null){
    if(!link&&userPlan==='free'&&allLinks.length>=FREE_LIMIT){upgradeOverlay.classList.add('open');return;}
    editingId=link?link.id:null;
    modalTitleText.textContent=link?'Edytuj link':'Nowy link';
    btnSave.textContent=link?'Zapisz zmiany':'Zapisz link';
    inputUrl.value=link?link.url:'';
    inputTitle.value=link?link.title:'';
    inputNote.value=link?link.note||'':'';
    inputTag.value=link?link.tag||'inne':'inne';
    modalOverlay.classList.add('open');
    setTimeout(()=>inputTitle.focus(),100);
  }
  function closeModal(){modalOverlay.classList.remove('open');editingId=null;}
  function closeUpgrade(){upgradeOverlay.classList.remove('open');}
  const tagIcons={praca:'💼',dev:'⚙️',finanse:'💰',prywatne:'🔒',inne:'🔗'};
  function getFiltered(){
    return allLinks.filter(l=>{
      const matchTag=currentTag==='all'||l.tag===currentTag;
      const q=searchQuery.toLowerCase();
      const matchSearch=!q||(l.title&&l.title.toLowerCase().includes(q))||(l.url&&l.url.toLowerCase().includes(q))||(l.note&&l.note.toLowerCase().includes(q));
      return matchTag&&matchSearch;
    });
  }
  function escHtml(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function renderLinks(){
    const filtered=getFiltered();
    linksGrid.innerHTML='';
    if(filtered.length===0){emptyState.style.display='block';return;}
    emptyState.style.display='none';
    filtered.forEach((link,i)=>{
      const card=document.createElement('div');
      card.className='link-card';
      card.style.animationDelay=`${i*40}ms`;
      const tag=link.tag||'inne';
      const icon=tagIcons[tag]||'🔗';
      card.innerHTML=`<div class="link-favicon">${icon}</div><div class="link-body"><div class="link-title">${escHtml(link.title)}</div><div class="link-url"><a href="${escHtml(link.url)}" target="_blank" rel="noopener">${escHtml(link.url)}</a></div><div class="link-meta"><span class="tag-badge tag-${tag}">#${tag}</span></div>${link.note?`<div class="link-note">📝 ${escHtml(link.note)}</div>`:''}</div><div class="link-actions"><button class="btn-icon edit" data-id="${link.id}">✏️</button><button class="btn-icon delete" data-id="${link.id}">🗑️</button></div>`;
      card.querySelector('.edit').addEventListener('click',()=>openModal(link));
      card.querySelector('.delete').addEventListener('click',()=>deleteLink(link.id));
      linksGrid.appendChild(card);
    });
  }
  async function fetchPlan(){const{data}=await _supabase.from('subscriptions').select('plan').eq('user_id',currentUser.id).maybeSingle();userPlan=data?.plan||'free';}
  async function fetchLinks(){
    if(!currentUser)return;
    const{data,error}=await _supabase.from('links').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});
    if(error){console.error(error);return;}
    allLinks=data||[];renderLinks();updateLimitBar();
  }
  async function saveLink(){
    const url=inputUrl.value.trim(),title=inputTitle.value.trim(),note=inputNote.value.trim(),tag=inputTag.value;
    if(!url||!title){showToast('URL i Tytuł są wymagane');return;}
    btnSave.disabled=true;btnSave.textContent='Zapisuję...';
    if(editingId){
      const{data,error}=await _supabase.from('links').update({url,title,note:note||null,tag}).eq('id',editingId).eq('user_id',currentUser.id).select();
      btnSave.disabled=false;btnSave.textContent='Zapisz zmiany';
      if(error){showToast('Błąd: '+error.message);return;}
      if(data&&data.length){const idx=allLinks.findIndex(l=>l.id===editingId);if(idx>-1)allLinks[idx]=data[0];}
      showToast('✅ Link zaktualizowany');
    } else {
      if(userPlan==='free'&&allLinks.length>=FREE_LIMIT){upgradeOverlay.classList.add('open');btnSave.disabled=false;btnSave.textContent='Zapisz link';return;}
      const{data,error}=await _supabase.from('links').insert([{user_id:currentUser.id,url,title,note:note||null,tag,created_at:new Date().toISOString()}]).select();
      btnSave.disabled=false;btnSave.textContent='Zapisz link';
      if(error){showToast('Błąd: '+error.message);return;}
      if(data&&data.length)allLinks.unshift(data[0]);
      showToast('✅ Link zapisany');
    }
    renderLinks();updateLimitBar();closeModal();
  }
  async function deleteLink(id){
    if(!confirm('Usunąć?'))return;
    const{error}=await _supabase.from('links').delete().eq('id',id).eq('user_id',currentUser.id);
    if(error){showToast('Błąd usuwania');return;}
    allLinks=allLinks.filter(l=>l.id!==id);
    renderLinks();updateLimitBar();showToast('🗑️ Usunięto');
  }
  async function logout(){await _supabase.auth.signOut();window.location.href='/login.html';}
  chips.forEach(chip=>{chip.addEventListener('click',()=>{chips.forEach(c=>c.classList.remove('active'));chip.classList.add('active');currentTag=chip.dataset.tag;renderLinks();});});
  btnLogout.addEventListener('click',logout);
  btnAdd.addEventListener('click',()=>openModal());
  btnClose.addEventListener('click',closeModal);
  btnSave.addEventListener('click',saveLink);
  btnSkipUpgrade.addEventListener('click',closeUpgrade);
  modalOverlay.addEventListener('click',e=>{if(e.target===modalOverlay)closeModal();});
  upgradeOverlay.addEventListener('click',e=>{if(e.target===upgradeOverlay)closeUpgrade();});
  searchInput.addEventListener('input',e=>{searchQuery=e.target.value;renderLinks();});
  [inputUrl,inputTitle,inputNote].forEach(el=>{el.addEventListener('keydown',e=>{if(e.key==='Enter')saveLink();});});
  async function init(){
    const{data:{session}}=await _supabase.auth.getSession();
    if(!session){window.location.href='/login.html';return;}
    currentUser=session.user;
    userEmailEl.textContent=currentUser.email||'';
    await fetchPlan();await fetchLinks();
    loadingScreen.style.display='none';
    _supabase.auth.onAuthStateChange(event=>{if(event==='SIGNED_OUT')window.location.href='/login.html';});
  }
  init();
</script>
</body>
</html>
